[pytest]
# Run from the repo root:  pytest            (offline, no account, no credits)
#                          pytest --live     (read-only against Snowflake)
# See tests/README.md for --live-write and --with-agent.
testpaths = tests
addopts = -rfEx -p no:cacheprovider
markers =
    live: reads from Snowflake over the configured connection (enable with --live)
    live_write: inserts into, then cleans, APP.ACTION_FEEDBACK (enable with --live-write)
    agent: calls APP.RM_COPILOT and spends Cortex credits (enable with --with-agent)
filterwarnings =
    ignore
